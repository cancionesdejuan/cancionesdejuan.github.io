    <style>
        :root {
            /* GitHub Light Mode Palette */
            --bg-color: #f6f8fa;
            --text-primary: #1F2328;
            --text-secondary: #656d76;
            --card-bg: #ffffff;
            --card-hover: #f3f4f6;
            --border-color: #d0d7de;
            --avatar-border: #e1e4e8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* GitHub Dark Mode Palette */
                --bg-color: #0d1117;
                --text-primary: #e6edf3;
                --text-secondary: #8b949e;
                --card-bg: #161b22;
                --card-hover: #21262d;
                --border-color: #30363d;
                --avatar-border: #30363d;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--avatar-border);
            margin-bottom: 16px;
            object-fit: cover;
            /* Replace src with your actual image path, e.g., avatar.jpg */
        }

        .avatar-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #cdd9e5;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }

        .handle {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 400px;
            margin: 0 auto;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
            position: relative;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-1px);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
            color: var(--text-primary);
        }

        .link-content {
            flex-grow: 1;
            text-align: center;
            margin-right: 40px; /* Offset to keep text centered despite the left icon */
        }

        .link-title {
            font-size: 15px;
            font-weight: 500;
        }

        .link-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        /* Optional bolding for the primary Spotify release button */
        .primary-link .link-title {
            font-weight: 700;
        }
    </style>
</head>
